name: Feature request
description: Suggest a scoped product improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User need
      description: What task is difficult today?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Proposed acceptance criteria
      description: What observable behavior would make this complete?
