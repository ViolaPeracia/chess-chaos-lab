name: Release / Windows x64
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Validate tag and branch
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected stable semantic version tag' }
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed' }
          $version = ($metadata.packages | Where-Object name -eq 'chess-chaos-lab').version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and Cargo version differ' }
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch main' }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tag is not on main history' }
      - name: Install stable Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Select stable toolchain
        run: rustup default stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Build and package portable ZIP
        shell: pwsh
        run: ./scripts/package.ps1 -Version $env:GITHUB_REF_NAME.Substring(1)
      - name: Verify package contents and checksum
        shell: pwsh
        run: |
          $name = "chess-chaos-lab-$env:GITHUB_REF_NAME-windows-x64.zip"
          $zip = Join-Path dist $name
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = (Get-Content -LiteralPath dist/SHA256SUMS.txt -Raw).Trim().Split(' ')[0]
          if ($actual -ne $expected) { throw 'ZIP checksum mismatch' }
          Add-Type -AssemblyName System.IO.Compression
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $zip).Path)
          try {
            $names = @($archive.Entries | ForEach-Object FullName)
            foreach ($required in @('chess-chaos-lab.exe', 'LICENSE', 'README.md', 'VERSION.txt', 'source/Cargo.toml', 'source/Cargo.lock')) {
              if ($required -notin $names) { throw "Missing package file: $required" }
            }
            if ($names | Where-Object { $_ -match '(?i)stockfish|\.env|target/' }) { throw 'Unexpected package content' }
          }
          finally { $archive.Dispose() }
      - name: Create draft release
        id: draft
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/chess-chaos-lab-${{ github.ref_name }}-windows-x64.zip
            dist/SHA256SUMS.txt
      - name: Verify uploaded assets and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh release view $env:GITHUB_REF_NAME --json assets,isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $release.isDraft) { throw 'Draft release missing' }
          $assetNames = @($release.assets | ForEach-Object name)
          foreach ($required in @("chess-chaos-lab-$env:GITHUB_REF_NAME-windows-x64.zip", 'SHA256SUMS.txt')) {
            if ($required -notin $assetNames) { throw "Uploaded asset missing: $required" }
          }
          $verify = Join-Path $env:RUNNER_TEMP 'release-verify'
          New-Item -ItemType Directory -Path $verify -Force | Out-Null
          gh release download $env:GITHUB_REF_NAME --dir $verify
          if ($LASTEXITCODE -ne 0) { throw 'Could not download draft assets' }
          $zipName = "chess-chaos-lab-$env:GITHUB_REF_NAME-windows-x64.zip"
          $localHash = (Get-FileHash -LiteralPath (Join-Path dist $zipName) -Algorithm SHA256).Hash
          $uploadedHash = (Get-FileHash -LiteralPath (Join-Path $verify $zipName) -Algorithm SHA256).Hash
          if ($localHash -ne $uploadedHash) { throw 'Uploaded ZIP differs from verified package' }
          $localSums = (Get-Content -LiteralPath dist/SHA256SUMS.txt -Raw).Trim()
          $uploadedSums = (Get-Content -LiteralPath (Join-Path $verify 'SHA256SUMS.txt') -Raw).Trim()
          if ($localSums -ne $uploadedSums) { throw 'Uploaded checksum differs from verified checksum' }
          gh release edit $env:GITHUB_REF_NAME --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Publishing release failed' }
